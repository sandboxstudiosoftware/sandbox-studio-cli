# GoReleaser configuration for sbs.
# Builds static binaries for macOS/Linux/Windows, publishes a GitHub release, a
# Homebrew cask and a Scoop manifest. Releases run in CI when a v* tag is pushed
# to the public repo (see sync-public.sh --tag).
# Dry-run locally: goreleaser release --snapshot --clean
version: 2

project_name: sbs

before:
  hooks:
    - go mod tidy

builds:
  - id: sbs
    main: ./cmd/sbs
    binary: sbs
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Homebrew tap: github.com/sandboxstudiosoftware/homebrew-tap (Casks/sbs.rb).
# CI provides a token with write access to it (secret TAP_GITHUB_TOKEN).
homebrew_casks:
  - name: sbs
    repository:
      owner: sandboxstudiosoftware
      name: homebrew-tap
    commit_author:
      name: Sandbox Studio Dev
      email: dev@sandboxstudiosoftware.com
    homepage: "https://sandboxstudiosoftware.com"
    description: "Sandbox Studio command-line client"
    binaries: [sbs]
    # The binary isn't signed/notarised by Apple, so clear the quarantine flag
    # that would otherwise make Gatekeeper block it on first run.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sbs"]
          end

# Scoop manifest for Windows: github.com/sandboxstudiosoftware/scoop-bucket.
scoops:
  - repository:
      owner: sandboxstudiosoftware
      name: scoop-bucket
    commit_author:
      name: Sandbox Studio Dev
      email: dev@sandboxstudiosoftware.com
    homepage: "https://sandboxstudiosoftware.com"
    description: "Sandbox Studio command-line client"
    license: "Apache-2.0"

release:
  draft: false
